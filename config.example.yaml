# PRODA MBS Checker Configuration
# Copy this file to config.yaml and fill in your credentials

proda:
  username: ""          # Your PRODA username
  password: ""          # Your PRODA password
  url: "https://proda.humanservices.gov.au/"

gmail:
  client_secret_path: "client_secret.json"   # Path to Google OAuth client secret
  token_path: "token.json"                    # Path to cached OAuth token (JSON format)

mbs:
  provider_location: "8X"    # Provider location code
  items_to_check:            # MBS item numbers to check
    - "00965"
    - "00967"
    - "2715"
    - "2717"

session:
  keepalive_interval_seconds: 300   # Keep-alive interval (5 minutes)
  preemptive_relogin_seconds: 21600 # Re-login before absolute session cap (6h, 0 disables)
  page_load_timeout: 30             # Page load timeout in seconds
  element_wait_timeout: 15          # Element wait timeout in seconds
  ajax_stability_delay: 0.05        # Delay between AJAX interactions in seconds
  retry_count: 3                    # Number of retries on failure

browser:
  type: "firefox"       # "firefox" or "chrome"
  headless: false       # Run browser in headless mode
  driver_path: ""       # Path to browser driver executable (leave empty for auto-detect)
